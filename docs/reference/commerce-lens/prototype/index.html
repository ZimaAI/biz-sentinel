function scopeChips(snap){return `<div class="scope-chips">${badge(scopeName(snap.scope),'primary')}${badge(rangeText(snap.ranges.current))}${badge('对比 '+rangeText(snap.ranges.baseline))}${badge('CNY · Asia/Shanghai')}</div>`;}
function claims(snap,source){const c=snap.current,b=snap.baseline,d=c.gmv-b.gmv,dc=decomposition(snap),f=focusStore(snap),fd=f.current.gmv-f.baseline.gmv;const direction=d<0?'下降':'增加';const inv=snap.period==='day'&&storeIds(snap.scope).includes('s1');return `<div class="claim main-claim">${badge('已观测事实','primary')}<h3>支付 GMV ${direction} ${money(Math.abs(d))}，变化 ${percent(change(c.gmv,b.gmv))} ${ev('E-001',source)}</h3><p>当前 ${money(c.gmv)}，对比期 ${money(b.gmv)}。成功退款按自己的成功时间统计，不抵减支付 GMV。</p></div><div class="claim">${badge('数学贡献','success')}<h3>${esc(f.name)}净变化 ${money(fd)} ${ev('E-002',source)}</h3><p>${d<0&&fd<0?`占范围净下降的 ${percent(fd/d,1)}。`:'按同一范围和时间口径进行分组比较。'}各店铺贡献之和等于整体 GMV 变化；这里描述数值贡献，不是因果结论。</p></div><div class="claim">${badge('可复算分解','success')}<h3>将整体变化拆为订单数与客单价两部分 ${ev('E-003',source)}</h3><p>${dc?`订单数贡献 ${money(dc.orders)}；客单价贡献 ${money(dc.aov)}。使用对称分解，避免分解顺序影响贡献。`:'订单数分母为零，客单价无法定义，因此拒绝输出两因子分解。'}</p></div>${inv?`<div class="claim claim-warning">${badge('待验证假设','warning')}<h3>主店核心 SKU 下滑与缺货信号同时出现 ${ev('E-004',source)}</h3><p>天猫核心 SKU 支付 GMV 从 ${money(agg('s1',snap.ranges.baseline).hotGmv)} 变为 ${money(agg('s1',snap.ranges.current).hotGmv)}；业务日缺货分钟数为 480，对比日为 30。两者相关不证明因果，也不能据此估计损失销售额。</p></div>`:''}<div class="boundary-box"><b>建议与边界</b><br>${inv?'核查库存同步、补货记录及活动变更，再决定是否采取行动。':'按店铺核查运营事件，再逐项验证假设。'}本快照不含广告、成本、用户去重或 SKU 退款分摊，因此不计算利润、不诊断广告归因、不输出 SKU 退款率。系统不自动补货、调价或退款。</div>`;}
function timeline(run){return `<div class="timeline">${STEPS.map(([title,sub],i)=>`<div class="timeline-item"><div class="timeline-dot ${i<run.step?'done':i===run.step&&run.status==='RUNNING'?'active':''}">${i<run.step?icon('check'):i+1}</div><div class="timeline-text"><b>${title}</b><p>${sub}${i<run.step?' · 本地模拟完成':''}</p></div></div>`).join('')}</div>`;}
function analysis(){const r=S.run;const active=r?.status==='RUNNING';const plan=r?`<section class="card mt"><div class="card-head"><div><h2>分析计划 <span class="small faint">v${r.planVersion}</span></h2><p>固定本次范围；页面筛选不会修改已创建运行</p></div>${badge(statusLabel[r.status],r.status==='SUCCEEDED'?'success':'primary')}</div>${scopeChips(r.snap)}${STEPS.map(([title,sub],i)=>`<div class="plan-item"><span class="step-number">0${i+1}</span><div><h3>${title}</h3><p>${sub}</p></div></div>`).join('')}<div class="cost-row"><span>只读查询</span><span>最多 12 次工具调用（设计预算）</span><span>当前未调用模型</span></div><div class="mt row">${r.status==='WAITING_APPROVAL'?'<button class="btn primary" data-action="approve-dialog">确认计划并开始 '+icon('play')+'</button>':''}${['RUNNING','WAITING_APPROVAL'].includes(r.status)?'<button class="btn" data-action="cancel-run">取消本次运行</button>':''}${r.status==='SUCCEEDED'?'<button class="btn primary" data-action="open-run-report">查看完整报告 '+icon('arrow')+'</button>':''}</div></section>`:'';
 const progress=!r?`<section class="card empty-result"><div class="orb">${icon('sparkle')}</div><h3>从一个经营问题开始</h3><p>先明确时间、指标与店铺范围，<br>再确认分析计划。<br>每条关键结论都能打开证据核对。</p><div class="divider"></div><p>本原型只内置支付 GMV 诊断场景；<br>正式 Agent 通过受控工具自主推进。</p></section>`:`<section class="card"><div class="card-head"><div><h2>执行轨迹</h2><p>${esc(r.id)} · ${r.step} / 6 个模拟步骤</p></div>${badge(statusLabel[r.status],r.status==='SUCCEEDED'?'success':'primary')}</div><div class="progress-track"><div style="width:${r.step/6*100}%"></div></div>${timeline(r)}<div class="divider"></div><dl class="definition-list"><dt>真实模型调用</dt><dd>0 次</dd><dt>真实 Token 用量</dt><dd>—（未调用模型）</dd><dt>数据快照</dt><dd>${D.datasetVersionId}</dd><dt>说明</dt><dd>动画由本地定时器驱动，不是服务端 SSE。</dd></dl></section>`;
 return pageHeading('诊断工作台','从问题到计划，从证据到结论。')+`<div class="subtle-banner">${icon('info')}离线演示：不调用模型或数据库。此页内置支付 GMV 诊断流程，正式工具调用规范见文档。</div><div class="analysis-layout"><div><section class="card ask-card"><div class="ask-title">${icon('sparkle')} ASK COMMERCE LENS</div><label class="visually-hidden" for="question">经营问题</label><textarea id="question" placeholder="描述你关心的经营变化…" ${active?'disabled':''}>${esc(S.question)}</textarea><div class="ask-footer"><div class="chips"><button class="chip" data-question="gmv">GMV 为什么变化？</button><button class="chip" data-question="sku-refund">试试能力边界</button></div><button class="btn primary" data-action="prepare" ${active?'disabled':''}>生成分析计划 ${icon('arrow')}</button></div></section>${S.notice?`<div class="notice mt"><h3>${esc(S.notice.title)}</h3><div>${esc(S.notice.text)}</div>${S.notice.clarify?'<button class="btn soft mt12" data-action="clarify-gmv">使用支付 GMV 口径</button>':''}</div>`:''}${plan}${r?.status==='SUCCEEDED'?`<section class="card mt"><div class="between"><h2>结论摘要</h2>${badge('数字已由合成数据复算','success')}</div>${claims(r.snap,'run')}</section>`:''}</div><div>${progress}</div></div>`;}
function prepareRun(){if(S.run?.status==='RUNNING'){toast('请先取消当前模拟运行。');return;}S.page='analysis';S.ui='normal';$('#ui-state').value='normal';const q=S.question.trim();S.notice=null;if(!q){S.notice={title:'请先输入经营问题',text:'需要问题、时间区间和店铺范围，才能形成可确认的计划。'};renderMain();return;}
 if(/(sku|商品).{0,12}(退款|退货)|(退款|退货).{0,12}(sku|商品)/i.test(q)){S.notice={title:'不支持 SKU 退款分析',text:'当前退款事实只有订单级来源，没有退款明细分摊。不能把整单退款归到每个 SKU。请改用店铺级成功退款额，或先补齐退款明细。'};renderMain();return;}
 if(/利润|毛利|广告|投产|补货|调价|执行.*sql|delete |drop |update |insert |select /i.test(q)){S.notice={title:'超出首版受控能力范围',text:'首版不具备成本和广告事实，不执行经营写操作或任意 SQL。本离线原型仅演示支付 GMV 诊断。'};renderMain();return;}
 if(/销售额/.test(q)&&!(/GMV|支付/i.test(q))){S.notice={title:'需要澄清指标口径',text:'“销售额”可能指下单金额、支付 GMV 或净收款。请先明确口径，不能静默选择。',clarify:true};renderMain();return;}
 if(!/GMV|支付金额|支付额/i.test(q)){S.notice={title:'原型没有内置该问法的诊断流程',text:'请使用支付 GMV 示例体验。正式系统支持的 8 个指标及受控工具定义见指标字典与 Agent 设计文档。'};renderMain();return;}
 const n=String(++S.counter).padStart(3,'0');S.run={id:'demo-run-'+n,status:'WAITING_APPROVAL',snap:snapshot(),question:q,planVersion:1,runVersion:2,step:0,events:[{sequence:1,type:'plan.ready',detail:'本地模拟计划已生成'}],createdAt:new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}),reportId:null};renderMain();toast('已生成计划；确认后才开始模拟执行。');}
function runEvent(type,detail){const r=S.run;r.events.push({sequence:r.events.length+1,type,detail});r.runVersion++;}
function startRun(expected){const r=S.run;if(!r||r.status!=='WAITING_APPROVAL'||r.planVersion!==expected){toast('计划版本已变化，请重新确认。');return;}r.status='RUNNING';runEvent('run.state.changed','用户确认指定版本计划（本地模拟）');closeOverlay();renderMain();S.timer=setInterval(()=>{if(!S.run||S.run!==r||r.status!=='RUNNING'){clearInterval(S.timer);return;}r.step++;runEvent('step.summary',STEPS[r.step-1][0]);if(r.step===6){clearInterval(S.timer);S.timer=null;r.status='SUCCEEDED';const report={id:r.id.replace('run','report'),runId:r.id,title:'支付 GMV 变化诊断',createdAt:r.createdAt,snap:r.snap,seed:false};S.reports.unshift(report);r.reportId=report.id;S.activeReport=report.id;runEvent('run.completed','报告已在当前浏览器会话中生成');toast('模拟诊断完成，结论可逐项查看证据。');}if(['analysis','runs','reports'].includes(S.page))renderMain();},550);}
function cancelRun(){if(!S.run||!['RUNNING','WAITING_APPROVAL'].includes(S.run.status))return;clearInterval(S.timer);S.timer=null;S.run.status='CANCELLED';runEvent('run.cancelled','用户取消本地模拟');closeOverlay();renderMain();toast('本次模拟已取消，没有经营操作被执行。');}
function anomalies(){const snap=snapshot(S.scope,'day'),f=focusStore(snap),gmvDrop=(snap.baseline.gmv-snap.current.gmv)/snap.baseline.gmv,delta=snap.baseline.gmv-snap.current.gmv;const visible=S.rule.enabled&&gmvDrop>=S.rule.relative/100&&delta>=S.rule.absolute*100;return pageHeading('异常中心','完整业务日监控，先核验数据，再识别经营异常。',`<button class="btn primary" data-action="rule-dialog">${icon('settings')} 编辑演示规则</button>`)+`<div class="subtle-banner">${icon('clock')}以下为合成数据上的规则预览。每日同星期中位数使用最近 8 个参考日；这里的周日基线均为同一数值。</div><div class="stat-grid"><section class="card"><span class="small muted">当前范围</span><div class="value" style="font-size:21px">${scopeName(S.scope)}</div></section><section class="card"><span class="small muted">参考样本</span><div class="value">8 <span class="small muted">个完整同星期日</span></div></section><section class="card"><span class="small muted">规则状态</span><div class="value" style="font-size:21px">${S.rule.enabled?'已启用 · 本地预览':'已停用 · 本地预览'}</div></section></div><div class="anomaly-grid"><section class="card anomaly-card"><div class="between">${badge(visible?'达到阈值':'未触发',visible?'warning':'success')}${badge('支付 GMV')}</div><h3 class="mt">${scopeName(S.scope)} · 日支付下降</h3><div class="anomaly-number ${visible?'down':''}">${percent(change(snap.current.gmv,snap.baseline.gmv))}</div><p>当前 ${money(snap.current.gmv)}，参考 ${money(snap.baseline.gmv)}。${ev('E-001')}</p><div class="divider"></div><p>同时满足下降 ≥ ${S.rule.relative}% 且 ≥ ¥${nfmt(S.rule.absolute)}；修改规则可查看触发状态变化。</p><button class="btn ${visible?'primary':'soft'} full mt" data-action="diagnose">查看诊断计划 ${icon('arrow')}</button></section><section class="card anomaly-card"><div class="between">${badge('分组观察','primary')}${badge('店铺贡献')}</div><h3 class="mt">${esc(f.name)}</h3><div class="anomaly-number">${money(f.current.gmv-f.baseline.gmv,0)}</div><p>本范围店铺中净变化最小的一家。分组贡献是对账结果，不自动升级为根因结论。${ev('E-002')}</p><div class="divider"></div><p>先确认支付订单数与客单价，再检查关联商品信号。</p><button class="btn soft full mt" data-store-analysis="${f.id}">单独诊断这家店铺 ${icon('arrow')}</button></section><section class="card anomaly-card"><div class="between">${badge('独立事件口径','warning')}${badge('成功退款')}</div><h3 class="mt">成功退款额变化</h3><div class="anomaly-number down">${percent(change(snap.current.refund,snap.baseline.refund))}</div><p>当前 ${money(snap.current.refund)}，参考 ${money(snap.baseline.refund)}。本日退款可能来自历史订单。${ev('E-005')}</p><div class="divider"></div><p>退款金额强度不是退款率；缺少退款 SKU 分摊时，不下钻 SKU。</p><button class="btn full mt" data-evidence="E-005" data-source="current">检查退款证据 ${icon('diagonal')}</button></section></div><section class="card mt"><div class="card-head"><div><h2>告警生命周期</h2><p>以下是设计说明；离线页面不运行后台调度器。</p></div>${badge('设计约束')}</div><div class="row wrap"><span class="pill warning">OPEN · 新异常</span>${icon('arrow')}<span class="pill primary">ACKNOWLEDGED · 已确认</span>${icon('arrow')}<span class="pill success">RESOLVED · 已恢复</span></div><p class="small muted mt">仅在数据完整且连续 2 个完整业务日恢复正常后自动关闭；冷却与去重不能掩盖更严重的变化。历史异常固定规则版本、参考日和数据版本。</p></section>`;}

function metricsPage(){const m=D.metrics.find(x=>x.metricId===S.metric),q=S.search.toLowerCase(),rows=D.metrics.filter(x=>(x.metricId+x.displayName+x.definition).toLowerCase().includes(q));return pageHeading('指标字典','统一指标口径，让经营数字可以解释、比较与复算。',`<div class="search">${icon('search')}<label class="visually-hidden" for="metric-search">搜索指标</label><input id="metric-search" value="${esc(S.search)}" placeholder="搜索指标名称或定义"></div>`)+`<div class="subtle-banner">${icon('shield')}标准查询只能引用已发布指标版本；指标定义由受控编译器实现，不由模型临时生成公式。</div><div class="metric-layout"><section class="card table-card"><div class="card-head"><h2>已发布指标 <span class="small faint">${rows.length} / 8</span></h2>${badge('版本 v1','success')}</div><div class="table-wrap"><table><thead><tr><th>指标名称</th><th>技术标识</th><th>可用维度</th><th>单位</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr class="clickable ${x.metricId===S.metric?'selected-row':''}" data-metric="${x.metricId}" tabindex="0" role="button" aria-label="查看${x.displayName}"><td><b>${x.displayName}</b></td><td class="tiny muted">${x.metricId}</td><td class="tiny">${x.supportedDimensions.map(y=>({day:'日期',store:'店铺',sku:'SKU'})[y]).join(' / ')}</td><td class="tiny">${x.unit==='CNY_CENT'?'CNY 分':x.unit==='COUNT'?'计数':'比值'}</td></tr>`).join(''):'<tr><td colspan="4">没有匹配指标。尝试名称、标识或定义中的关键词。</td></tr>'}</tbody></table></div></section><aside class="card"><div class="between"><h2>${m.displayName}</h2>${badge('已发布','success')}</div><p class="tiny faint mt8">${m.metricId} · v${m.version}</p><div class="formula">${esc(formulas[m.metricId])}</div><dl class="definition-list"><dt>业务定义</dt><dd>${m.definition}</dd><dt>依赖事实</dt><dd>${m.requiredFacts.join('、')}</dd><dt>零分母处理</dt><dd>${m.zeroDenominatorPolicy==='NULL'?'返回 NULL 并解释分母为零；不显示 0%':'可加总指标；完整数据无事件时为 0'}</dd><dt>可用维度</dt><dd>${m.supportedDimensions.join(' / ')}</dd><dt>编译器标识</dt><dd class="tiny">${m.compilerKey}</dd></dl><div class="boundary-box"><b>分析边界</b><br>${m.note}。比率先汇总分子与分母，禁止简单平均店铺比率；金额默认先以分计算，展示时转换为元。SKU 仅开放支付 GMV。</div><button class="btn soft full mt" data-evidence="${m.metricId.includes('refund')?'E-005':'E-001'}" data-source="current">查看关联演示证据 ${icon('diagonal')}</button></aside></div>`;}
function dataPage(){const titles={stores:'店铺',products:'商品',orders:'订单',order_items:'订单明细',payments:'成功支付',refunds:'成功退款',traffic_daily:'店铺日流量',inventory_daily:'商品日库存'};return pageHeading('数据中心','不可变数据快照：来源可追溯，历史报告可复算。',`<button class="btn primary" data-action="import-dialog">${icon('plus')} 查看导入与校验</button>`)+`<div class="subtle-banner">${icon('database')}这些数据由项目内脚本生成，不来自真实天猫、抖音或京东商家；没有连接任何电商平台账户。</div><div class="stat-grid"><section class="card"><span class="small muted">已发布业务表</span><div class="value">8 <span class="small muted">/ 8</span></div></section><section class="card"><span class="small muted">完整业务日覆盖</span><div class="value">57 <span class="small muted">天</span></div></section><section class="card"><span class="small muted">统一币种 / 时区</span><div class="value" style="font-size:22px">CNY <span class="small muted">/ Asia/Shanghai</span></div></section></div><section class="card table-card"><div class="card-head"><div><h2>规范业务数据集</h2><p>${D.datasetVersionId} · 2026-07-26 至 2026-09-20</p></div>${badge('合成快照已生成','success')}</div><div class="table-wrap"><table><thead><tr><th>数据表</th><th>规范文件</th><th class="numeric">实际 CSV 行数</th><th>快照状态</th><th>用途</th></tr></thead><tbody>${Object.entries(D.fileRows).map(([file,rows])=>{const key=file.replace('.csv','');return `<tr><td><b>${titles[key]||esc(key)}</b></td><td class="tiny muted">${esc(file)}.csv</td><td class="numeric">${nfmt(rows)}</td><td>${badge('文件已生成','success')}</td><td class="small muted">${['payments','refunds'].includes(key)?'按实际事件时间聚合':key==='order_items'?'SKU 实付金额分摊':key==='traffic_daily'?'会话数，非去重用户':'版本化维度 / 业务事实'}</td></tr>`;}).join('')}</tbody></table></div></section><div class="main-grid mt"><section class="card"><h2>发布前必须完成的检查</h2><div class="scope-chips">${['8 表清单及校验和','租户 / 店铺隔离','唯一键与引用关系','实付与明细对账','退款累计不超支付','完整日期覆盖'].map(x=>badge(x)).join('')}</div><p class="small muted">实际后端先导入暂存区，校验全部通过后原子发布快照。失败批次不能被经营查询读取。此页只展示本地文件元数据，不代表数据库已导入。</p></section><section class="card"><h2>先标准 CSV，再真实平台适配</h2><p class="small muted mt12">首版使用标准 CSV 和 manifest.json。真实平台接入属于后续适配器工作，需要商家授权、官方接口能力核实及字段映射，不通过页面模拟连接成功。</p></section></div>`;}
function reportsPage(){const r=reportOf(),s=r.snap,c=s.current,b=s.baseline;return pageHeading('报告中心','报告固定生成时的范围、时间与数据版本，不随页面筛选改变。',`<button class="btn primary" data-action="export-report">${icon('download')} 导出 Markdown</button>`)+`<div class="report-layout"><aside class="report-list">${S.reports.map(x=>`<button class="report-menu-item ${x.id===r.id?'active':''}" data-report="${x.id}"><div class="between">${badge(x.seed?'内置示例':'本次模拟','primary')}${icon('file')}</div><h3 class="mt12">${x.title}</h3><p>${scopeName(x.snap.scope)}<br>${rangeText(x.snap.ranges.current)}<br>${esc(x.createdAt)}</p></button>`).join('')}</aside><article class="card report-paper"><div class="between"><span class="report-kicker">COMMERCE LENS / ANALYSIS NOTE</span>${badge('合成数据报告','warning')}</div><h2>${esc(r.title)}</h2><div class="report-metadata" data-report-scope="${s.scope}">${scopeName(s.scope)}　·　${rangeText(s.ranges.current)}<br>对比 ${rangeText(s.ranges.baseline)}　·　数据版本 ${D.datasetVersionId}<br>运行 ${r.runId}　·　所有数值来自随附合成 CSV，不含真实经营数据</div><div class="quote">本范围支付 GMV 为 <b>${money(c.gmv)}</b>，较对比区间${c.gmv<b.gmv?'减少':'增加'} <b>${money(Math.abs(c.gmv-b.gmv))}</b>。先解释数学贡献，再把需要调查的经营原因标记为假设。</div><div class="result-metrics"><div class="result-metric"><span class="tiny muted">支付订单数</span><div class="value num">${nfmt(c.orders)}</div></div><div class="result-metric"><span class="tiny muted">客单价</span><div class="value num">${c.aov==null?'—':money(c.aov)}</div></div><div class="result-metric"><span class="tiny muted">成功退款额</span><div class="value num">${money(c.refund)}</div></div></div><h3 class="report-section-title">关键发现与证据</h3>${claims(s,'report')}<div class="report-footer">数值引用依据：E-001 总量、E-002 店铺、E-003 分解、E-004 库存、E-005 退款。<br>本原型报告仅保存在当前浏览器内存；刷新页面后仅保留内置示例。导出文件包含计算值和解释，不含真实查询审计签名。</div></article></div>`;}
function runsPage(){const r=S.run;return pageHeading('运行审计','观察计划、步骤、事件与证据；不要把动画当成真实执行监控。',`<button class="btn soft" data-nav="analysis">${icon('sparkle')} 打开诊断工作台</button>`)+`<div class="subtle-banner">${icon('info')}本页事件由前端模拟；真实服务需持久化运行状态、递增 sequence、租约与审计记录，SSE 只是订阅通道。</div><div class="stat-grid"><section class="card"><span class="small muted">当前浏览器创建的运行</span><div class="value">${r?1:0}</div></section><section class="card"><span class="small muted">真实模型调用 / Token</span><div class="value">0 <span class="small muted">/ —</span></div></section><section class="card"><span class="small muted">当前运行模拟步骤</span><div class="value">${r?.step||0} <span class="small muted">/ 6</span></div></section></div>${r?`<div class="main-grid"><section class="card table-card"><div class="card-head"><div><h2>运行事件</h2><p>${r.id} · runVersion ${r.runVersion}</p></div>${badge(statusLabel[r.status],'primary')}</div><div class="table-wrap"><table><thead><tr><th>序号</th><th>事件</th><th>说明</th></tr></thead><tbody>${r.events.map(x=>`<tr><td class="num">${x.sequence}</td><td class="tiny">${x.type}</td><td class="small">${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>固定运行上下文</h2>${scopeChips(r.snap)}<dl class="definition-list"><dt>指标版本</dt><dd>8 个指标均为 v1</dd><dt>计划版本</dt><dd>v${r.planVersion}</dd><dt>数据版本</dt><dd>${D.datasetVersionId}</dd><dt>计划确认</dt><dd>${r.status==='WAITING_APPROVAL'?'等待用户确认':'参见事件列表'}</dd><dt>服务端租约</dt><dd>未实现；本页为离线模拟</dd></dl><button class="btn soft full mt" data-nav="analysis">查看运行详情 ${icon('arrow')}</button></section></div>`:`<section class="card empty-result"><div class="orb">${icon('activity')}</div><h3>当前浏览器尚未创建运行</h3><p>从诊断工作台生成计划，确认后观察事件序号和各步骤变化。</p><button class="btn primary mt" data-action="diagnose">开始一次诊断</button></section>`}`;}

let focusBeforeOverlay=null;
function modal(title,body,actions){focusBeforeOverlay=document.activeElement;S.modal={title};$('#overlay-root').innerHTML=`<div class="modal-backdrop" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close-overlay" aria-label="关闭对话框">${icon('close')}</button></div>${body}<div class="modal-actions">${actions}</div></section></div>`;requestAnimationFrame(()=>$('.modal button')?.focus());}
function closeOverlay(){S.modal=null;S.drawer=null;$('#overlay-root').innerHTML='';focusBeforeOverlay?.isConnected&&focusBeforeOverlay.focus();}
function approveDialog(){const r=S.run;if(!r||r.status!=='WAITING_APPROVAL')return;modal('确认本次分析计划',`<p class="small muted">确认后将启动本地模拟执行。正式服务必须重新校验登录身份、权限版本、计划版本与预算。</p>${scopeChips(r.snap)}<dl class="definition-list mt"><dt>运行编号</dt><dd>${r.id}</dd><dt>计划版本</dt><dd>v${r.planVersion} · runVersion ${r.runVersion}</dd><dt>只读范围</dt><dd>8 个受控指标，不执行任意 SQL，不修改经营数据</dd><dt>执行性质</dt><dd>6 步浏览器模拟；没有模型费用或数据库执行</dd></dl>`,`<button class="btn" data-action="close-overlay">返回检查</button><button class="btn primary" data-approve-version="${r.planVersion}">确认并模拟执行</button>`);}
function ruleDialog(){modal('编辑支付 GMV 下降规则',`<p class="small muted mb">规则仅保留在当前浏览器内存。两项阈值必须同时满足。</p><div class="form-grid"><label class="field">相对下降阈值（%）<input id="rule-relative" type="number" min="0.1" max="100" step="0.1" value="${S.rule.relative}"></label><label class="field">绝对下降阈值（元）<input id="rule-absolute" type="number" min="0" step="1" value="${S.rule.absolute}"></label></div><label class="field mt12">规则状态<select id="rule-enabled"><option value="true" ${S.rule.enabled?'selected':''}>启用</option><option value="false" ${S.rule.enabled?'':'selected'}>停用</option></select></label><div class="boundary-box">仅预览单日完整业务数据。正式服务按最近 8 个同星期完整日的中位数建立基线，不足 4 个有效样本时返回不可评估状态。</div><div id="rule-error" class="field-error" role="alert"></div>`,`<button class="btn" data-action="close-overlay">取消</button><button class="btn primary" data-action="save-rule">保存演示规则</button>`);}
function saveRule(){const rel=Number($('#rule-relative').value),abs=Number($('#rule-absolute').value);if(!Number.isFinite(rel)||rel<=0||rel>100||!Number.isFinite(abs)||abs<0||abs>1e9||$('#rule-relative').value===''||$('#rule-absolute').value===''){$('#rule-error').textContent='相对阈值需大于 0 且不超过 100；金额需在 0～10 亿元之间。';return;}S.rule={relative:rel,absolute:abs,enabled:$('#rule-enabled').value==='true'};closeOverlay();renderMain();toast('演示规则已保存；未启动任何后台监控。');}
function importDialog(){modal('规范 CSV 导入与校验',`<p class="small muted">交付包中 fixtures/business/t_demo/ 包含 8 个 CSV 和 manifest.json。正式导入必须由服务端执行，不在此页伪造上传成功。</p><div class="upload-zone mt"><div class="row" style="justify-content:center">${icon('database')}8 个规范 CSV + manifest.json</div><p class="small mt8">上传 → 暂存 → 校验 → 待发布 → 原子发布</p></div><div class="boundary-box">必须验证 manifest 声明、文件校验和、字段类型、数据行数、复合唯一键、租户和店铺引用、订单实付对账、退款限额、覆盖日期以及缺失来源。任何错误均不发布。</div><p class="small muted mt">后端执行入口与字段规范见 11-INGESTION.md 和 database/README.md；原型只读展示已生成的合成文件元数据。</p>`,`<button class="btn primary" data-action="close-overlay">已了解导入约束</button>`);}
function evidenceSnap(source){return source==='run'&&S.run?S.run.snap:source==='report'?reportOf().snap:snapshot();}
function openEvidence(id,source){focusBeforeOverlay=document.activeElement;S.drawer={id,snap:evidenceSnap(source),source};S.drawerTab='summary';renderDrawer();requestAnimationFrame(()=>$('.drawer button')?.focus());}
const evidenceTitles={'E-001':'支付总量与同期比较','E-002':'店铺贡献明细','E-003':'订单数 × 客单价分解','E-004':'商品与库存关联信号','E-005':'退款事件口径与金额'};
function evidenceRows(id,s){const c=s.current,b=s.baseline;if(id==='E-001')return [['支付 GMV',money(c.gmv),money(b.gmv)],['支付订单数',nfmt(c.orders),nfmt(b.orders)],['客单价',money(c.aov),money(b.aov)],['会话数',nfmt(c.sessions),nfmt(b.sessions)],['支付订单转化比',percent(c.conversion),percent(b.conversion)]];if(id==='E-002')return s.stores.map(x=>[x.name,money(x.current.gmv),money(x.baseline.gmv)]);if(id==='E-003'){const d=decomposition(s);return d?[['订单数贡献',money(d.orders),'对称分解'],['客单价贡献',money(d.aov),'对称分解'],['贡献合计',money(d.orders+d.aov),money(c.gmv-b.gmv)]]:[['不可计算','订单数为 0','没有可定义的客单价']];}if(id==='E-005')return [['成功退款额',money(c.refund),money(b.refund)],['净收款额',money(c.net),money(b.net)],['退款金额强度',percent(c.refundIntensity),percent(b.refundIntensity)]];if(s.period==='day'&&storeIds(s.scope).includes('s1'))return [['天猫核心 SKU GMV',money(agg('s1',s.ranges.current).hotGmv),money(agg('s1',s.ranges.baseline).hotGmv)],['缺货分钟数','480','30'],['证据类型','关联信号','不证明因果']];return [['当前范围','无内置库存诊断','不得引用其他范围证据']];}
function sqlTemplate(id){if(id==='E-003')return '-- 对称分解在 Java DecimalMath 中确定性计算，不生成 SQL。\norderContribution = (N1 - N0) * (A0 + A1) / 2;\naovContribution   = (A1 - A0) * (N0 + N1) / 2;\nassertEqual(sumContributions, GMV1 - GMV0);';if(id==='E-004')return '-- 模板预览，未执行；GMV 与库存独立查询，禁止 fan-out。\nSELECT store_id, product_id, biz_date, stockout_minutes\nFROM cl_inventory_daily\nWHERE tenant_id = :tenant_id\n  AND dataset_version_id = :dataset_version_id\n  AND store_id IN (:store_ids)\n  AND biz_date >= :start_date\n  AND biz_date < :end_exclusive;';const ref=id==='E-005',field='amount_cents',time=ref?'succeeded_at_utc':'paid_at_utc';return `-- 模板预览，未执行。当前期与基准期分别绑定参数。\nSELECT store_id, SUM(${field}) AS amount_cents${ref?'':',\n       COUNT(*) AS paid_orders'}\nFROM cl_${ref?'refund':'payment'}\nWHERE tenant_id = :tenant_id\n  AND dataset_version_id = :dataset_version_id\n  AND store_id IN (:store_ids)\n  AND ${time} >= :start_utc\n  AND ${time} < :end_utc\nGROUP BY store_id;\n-- 支付、退款、流量先独立聚合，再按店铺组合。\n-- 实际模板和 schema 以 database/003-query-templates.sql 为准。`;}
function renderDrawer(){const e=S.drawer;if(!e)return;const s=e.snap,c=s.current,b=s.baseline,id=e.id;let content='';if(S.drawerTab==='sql'){const utc=d=>new Date(d+'T00:00:00+08:00').toISOString();const params={tenant_id:'t_demo',dataset_version_id:D.datasetVersionId,store_ids:storeIds(s.scope),current:{start_utc:utc(s.ranges.current.start),end_utc:utc(s.ranges.current.endExclusive)},baseline:{start_utc:utc(s.ranges.baseline.start),end_utc:utc(s.ranges.baseline.endExclusive)}};content=`<div class="between"><h3>受控模板预览 · 未执行</h3><button class="btn text" data-action="copy-sql">${icon('copy')} 复制</button></div><pre class="code-block">${esc(sqlTemplate(id))}</pre><h3 class="mt">模拟参数快照</h3><pre class="code-block">${esc(JSON.stringify(params,null,2))}</pre><p class="small muted">生产环境的租户与可访问店铺由服务端身份上下文生成，不能信任模型或浏览器提交值。</p>`;}else if(S.drawerTab==='meta'){content=`<dl class="definition-list"><dt>证据编号</dt><dd>${id} · 本地示例编号</dd><dt>数据集</dt><dd>${D.datasetVersionId}</dd><dt>固定店铺范围</dt><dd>${scopeName(s.scope)}</dd><dt>指标版本</dt><dd>v1 · 见 metrics.json</dd><dt>业务时区</dt><dd>Asia/Shanghai</dd><dt>金额口径</dt><dd>CNY 分，展示为元</dd><dt>SQL 耗时</dt><dd>未执行</dd><dt>模型 / Token</dt><dd>未调用 / —</dd><dt>真实审计签名</dt><dd>原型未生成；生产环境由服务端记录</dd><dt>来源说明</dt><dd>57 日合成标准 CSV，经聚合后嵌入原型。</dd></dl>`;}else{content=`${S.drawerTab==='summary'?`<div class="quote" style="font-size:13px">${id==='E-004'?'这里只能验证商品下滑与库存信号同时出现，不证明库存问题造成 GMV 下降。':id==='E-003'?'订单数与客单价使用对称两因子分解。两个贡献相加必须等于整体 GMV 差额。':id==='E-005'?'退款按实际成功时间独立统计。退款金额强度不是支付订单批次的退款率。':'同一数据版本、同一指标口径、同一授权范围下比较当前区间与对比区间。'}</div>`:''}${scopeChips(s)}<div class="table-wrap"><table><thead><tr><th>项目</th><th class="numeric">当前 / 贡献</th><th class="numeric">基准 / 校验</th></tr></thead><tbody>${evidenceRows(id,s).map(row=>`<tr>${row.map((x,i)=>`<td class="${i?'numeric':''}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${id==='E-002'?`<div class="formula">Σ(店铺当前 GMV − 店铺基准 GMV)<br>= ${money(c.gmv-b.gmv)} = 整体 GMV 变化</div>`:''}<div class="boundary-box">此结果来自合成 CSV 的浏览器聚合，不是数据库执行结果。完整校验脚本和预期值随项目交付；缺失值、权限撤销与 SQL 拦截仍需正式后端实现。</div>`;}
 $('#overlay-root').innerHTML=`<div class="drawer-backdrop" data-backdrop="true"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="evidence-title"><header class="drawer-head"><div class="between"><span class="report-kicker">EVIDENCE / ${id}</span><button class="icon-btn" data-action="close-overlay" aria-label="关闭证据抽屉">${icon('close')}</button></div><h2 id="evidence-title" class="mt12">${evidenceTitles[id]}</h2><p class="small muted mt8">合成证据 · 非数据库审计记录</p></header><div class="drawer-tabs" role="tablist">${[['summary','证据摘要'],['result','结果明细'],['sql','SQL 与参数'],['meta','来源元数据']].map(([k,v])=>`<button role="tab" aria-selected="${S.drawerTab===k}" data-drawer-tab="${k}" class="${S.drawerTab===k?'active':''}">${v}</button>`).join('')}</div><div class="drawer-content">${content}</div><footer class="drawer-footer">证据范围固定为打开时的快照；正式系统每次读取仍必须校验当前权限。</footer></aside></div>`;}
function markdownReport(r){const s=r.snap,c=s.current,b=s.baseline,d=decomposition(s);let text=`# ${r.title}\n\n> 合成数据离线原型报告；不是实际模型或数据库执行产物。\n\n- 范围：${scopeName(s.scope)}\n- 当前：${rangeText(s.ranges.current)}\n- 对比：${rangeText(s.ranges.baseline)}\n- 数据版本：${D.datasetVersionId}\n- 时区：Asia/Shanghai；币种：CNY\n- 运行编号：${r.runId}\n\n## 已观测事实 [E-001]\n\n支付 GMV：${money(c.gmv)}；基准：${money(b.gmv)}；变化：${money(c.gmv-b.gmv)}（${percent(change(c.gmv,b.gmv))}）。\n\n支付订单数 ${c.orders}；客单价 ${money(c.aov)}；成功退款 ${money(c.refund)}；净收款 ${money(c.net)}。净收款不等于利润。\n\n## 店铺贡献 [E-002]\n\n| 店铺 | 当前 GMV | 基准 GMV | 差额 |\n| --- | ---: | ---: | ---: |\n`;for(const x of s.stores)text+=`| ${x.name} | ${money(x.current.gmv)} | ${money(x.baseline.gmv)} | ${money(x.current.gmv-x.baseline.gmv)} |\n`;text+=`\n## 数学分解 [E-003]\n\n${d?`订单贡献 ${money(d.orders)}；客单价贡献 ${money(d.aov)}；未四舍五入值之和与 GMV 变化相等。`:'订单数为零，不进行客单价分解。'}\n\n公式：订单贡献=(N1-N0)*(A0+A1)/2；客单价贡献=(A1-A0)*(N0+N1)/2。\n`;
 if(s.period==='day'&&storeIds(s.scope).includes('s1'))text+=`\n## 待验证假设 [E-004]\n\n天猫核心 SKU GMV 从 ${money(agg('s1',s.ranges.baseline).hotGmv)} 降至 ${money(agg('s1',s.ranges.current).hotGmv)}；缺货分钟数为 480，对比为30。相关不等于因果，不据此估计损失销售额。\n`;
 return text+`\n## 限制与建议\n\n核查库存同步和活动记录后再验证假设。不具备成本、广告、SKU退款分摊与跨店去重用户事实；不计算利润或SKU退款率。禁止自动补货、调价、退款。\n\n## 证据来源\n\n随附 fixtures/business/t_demo/ 标准 CSV 和 fixtures/golden.json。E 编号是本地示例引用，没有真实查询签名。所有报告在浏览器当前会话内存中保存。\n`;}
function exportReport(){const r=reportOf();const a=document.createElement('a');const url=URL.createObjectURL(new Blob([markdownReport(r)],{type:'text/markdown;charset=utf-8'}));a.href=url;a.download=`CommerceLens_${r.id}.md`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已生成当前固定范围的 Markdown 报告。');}
let toastTimer;function toast(text){$('#toast-root').innerHTML=`<div class="toast" role="status">${esc(text)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',3500);}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('copy unavailable');t.remove();}toast('模板已复制；此 SQL 未执行。');}catch(_){toast('浏览器不允许自动复制，请手动选择模板内容。');}}
function navigate(page){if(!pages[page])return;S.page=page;S.mobile=false;renderMain();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',evnt=>{const el=evnt.target.closest('button,[data-metric],[data-backdrop]');if(!el)return;if(el.dataset.backdrop&&evnt.target===el){closeOverlay();return;}if(el.dataset.nav){navigate(el.dataset.nav);return;}if(el.dataset.chart){S.chart=el.dataset.chart;renderMain();return;}if(el.dataset.storeAnalysis){S.scope=el.dataset.storeAnalysis;S.question='分析支付 GMV 的变化和主要贡献因素，并给出证据。';prepareRun();return;}if(el.dataset.evidence){openEvidence(el.dataset.evidence,el.dataset.source||'current');return;}if(el.dataset.metric){S.metric=el.dataset.metric;renderMain();return;}if(el.dataset.report){S.activeReport=el.dataset.report;renderMain();return;}if(el.dataset.drawerTab){S.drawerTab=el.dataset.drawerTab;renderDrawer();$(`[data-drawer-tab="${S.drawerTab}"]`)?.focus();return;}if(el.dataset.approveVersion){startRun(Number(el.dataset.approveVersion));return;}if(el.dataset.question){S.question=el.dataset.question==='gmv'?'分析当前范围支付 GMV 的变化和主要贡献因素，并给出证据。':'分析 SKU 退款率为什么上升？';S.notice=null;renderMain();return;}
 const a=el.dataset.action;if(!a)return;({refresh:()=>toast('当前展示固定合成快照；没有请求远端数据。'),mobile:()=>{S.mobile=!S.mobile;$('.sidebar').classList.toggle('mobile-open',S.mobile);$('.sidebar').inert=window.innerWidth<=800&&!S.mobile;},'reset-state':()=>{S.ui='normal';$('#ui-state').value='normal';renderMain();},diagnose:()=>{S.question='分析当前范围支付 GMV 的变化和主要贡献因素，并给出证据。';prepareRun();},prepare:prepareRun,'approve-dialog':approveDialog,'cancel-run':cancelRun,'open-run-report':()=>{S.activeReport=S.run.reportId;navigate('reports');},'rule-dialog':ruleDialog,'save-rule':saveRule,'import-dialog':importDialog,'close-overlay':closeOverlay,'export-report':exportReport,'copy-sql':()=>copyText(sqlTemplate(S.drawer.id)),'clarify-gmv':()=>{S.question='使用支付 GMV 口径，分析当前范围变化并给出证据。';prepareRun();}}[a]||(()=>{}))();});
document.addEventListener('change',e=>{if(e.target.id==='scope'){S.scope=e.target.value;renderMain();}else if(e.target.id==='period'){S.period=e.target.value;renderMain();}else if(e.target.id==='ui-state'){S.ui=e.target.value;closeOverlay();if(S.ui==='forbidden'&&S.run?.status==='RUNNING'){clearInterval(S.timer);S.run.status='ACCESS_REVOKED';runEvent('access.revoked','界面模拟撤销；生产后端仍须主动检查');}renderMain();}});
document.addEventListener('input',e=>{if(e.target.id==='question')S.question=e.target.value;else if(e.target.id==='metric-search'){const pos=e.target.selectionStart;S.search=e.target.value;renderMain();$('#metric-search').focus();$('#metric-search').setSelectionRange(pos,pos);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOverlay();S.mobile=false;$('.sidebar')?.classList.remove('mobile-open'); if($('.sidebar'))$('.sidebar').inert=window.innerWidth<=800;}if((e.key==='Enter'||e.key===' ')&&e.target.dataset.metric){e.preventDefault();e.target.click();}if(e.key==='Tab'&&(S.modal||S.drawer)){const root=$('.modal')||$('.drawer');const items=[...root.querySelectorAll('button:not(:disabled),input,select,textarea,a[href],[tabindex="0"]')];if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
// Expose immutable debug snapshots for reproducible prototype-only checks, not a backend API.
window.CommerceLensDemo={snapshot:(scope='all',period='day')=>JSON.parse(JSON.stringify(snapshot(scope,period))),state:()=>({page:S.page,scope:S.scope,period:S.period,run:S.run?{id:S.run.id,status:S.run.status,step:S.run.step}:null,reportCount:S.reports.length}),dataVersion:D.datasetVersionId};
window.addEventListener('resize',()=>{if($('.sidebar'))$('.sidebar').inert=window.innerWidth<=800&&!S.mobile;});
shell();
})();
</script></body></html>
