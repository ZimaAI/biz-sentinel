          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/Anomaly'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: anomalyId
        in: path
        required: true
        schema: *id001
      - *id003
      requestBody:
        required: true
