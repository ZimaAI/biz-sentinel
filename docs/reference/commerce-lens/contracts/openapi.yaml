                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Anomaly'
                      nextCursor:
                        type:
                        - string
                        - 'null'
                    required:
