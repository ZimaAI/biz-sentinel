openapi: 3.1.0
info:
  title: CommerceLens 电商经营分析 API
  version: 1.0.0-design
  description: 'Proposed extension contract, not an upstream API or an implemented production backend. Monetary units: integer
    cents encoded as strings. Business timezone: Asia/Shanghai.'
servers:
- url: /api/commerce/v1
security:
- sessionCookie: []
paths:
  /me:
    get:
      operationId: getMe
      summary: 当前身份与授权范围
      tags:
      - me
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: &id001
                    type: string
                    minLength: 1
                    maxLength: 96
                  data:
                    $ref: '#/components/schemas/Me'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /overview:
    get:
      operationId: getOverview
      summary: 授权范围的经营总览
      tags:
      - overview
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/Overview'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: storeIds
        in: query
        required: true
        schema:
          type: array
          items: *id001
      - name: start
        in: query
        required: true
        schema: &id002
          type: string
          format: date
      - name: endExclusive
        in: query
        required: true
        schema: *id002
      - name: comparison
        in: query
        required: true
        schema:
          enum:
          - PREVIOUS_WEEK_SAME_DAYS
          - PREVIOUS_PERIOD
  /metrics:
    get:
      operationId: listMetrics
      summary: 已发布指标目录
      tags:
      - metrics
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Metric'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /queries:
    post:
      operationId: queryMetrics
      summary: 执行严格受控的指标查询
      tags:
      - queries
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/QueryResult'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id003
        name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
        description: Required with authenticated same-origin mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                requestedStoreIds:
                  type: array
                  items: *id001
                  minItems: 1
                spec:
                  $ref: '#/components/schemas/QuerySpec'
              required:
              - requestedStoreIds
              - spec
  /runs:
    post:
      operationId: createRun
      summary: 创建诊断运行，连接与执行独立
      tags:
      - runs
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/Run'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id006
        name: Idempotency-Key
        in: header
        required: true
        schema: *id001
        description: Same tenant/subject/operation/key with different body returns 409.
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRun'
    get:
      operationId: listRuns
      summary: 当前用户可见运行
      tags:
      - runs
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Run'
                      nextCursor:
                        type:
                        - string
                        - 'null'
                    required:
                    - items
                    - nextCursor
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id004
        name: cursor
        in: query
        required: false
        schema: &id007
          type: string
      - &id005
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        required: false
        schema:
          enum: &id011
          - QUEUED
          - PLANNING
          - WAITING_APPROVAL
          - RUNNING
          - CANCEL_REQUESTED
          - SUCCEEDED
          - PARTIAL
          - FAILED
          - CANCELLED
          - EXPIRED
          - ACCESS_REVOKED
  /runs/{runId}:
    get:
      operationId: getRun
      summary: 运行快照
      tags:
      - runs
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/Run'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: runId
        in: path
        required: true
        schema: *id001
  /runs/{runId}/approval:
    post:
      operationId: approveRun
      summary: 批准或拒绝指定版本计划
      tags:
      - runs
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/Run'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: runId
        in: path
        required: true
        schema: *id001
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Approval'
  /runs/{runId}/cancel:
    post:
      operationId: cancelRun
      summary: 幂等请求取消
      tags:
      - runs
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/Run'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: runId
        in: path
        required: true
        schema: *id001
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedRunVersion:
                  type: integer
                  minimum: 1
              required:
              - expectedRunVersion
  /runs/{runId}/events:
    get:
      operationId: subscribeRunEvents
      summary: SSE订阅与重放，不启动任务
      tags:
      - runs
      responses:
        '200':
          description: 'Ordered persistent events; heartbeat comments have no ID. Event payload follows RunEvent. Expired
            cursor: 410.'
          content:
            text/event-stream:
              schema:
                type: string
              example: 'id: 1

                event: run.created

                data: {"schemaVersion":"1.0","runId":"r1","sequence":1,"type":"run.created","occurredAt":"2026-09-21T01:00:00Z","payload":{}}


                '
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: runId
        in: path
        required: true
        schema: *id001
  /evidence/{evidenceId}:
    get:
      operationId: getEvidence
      summary: 读取当前仍有权访问的证据
      tags:
      - evidence
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/Evidence'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: evidenceId
        in: path
        required: true
        schema: *id001
  /reports:
    get:
      operationId: listReports
      summary: 当前可见报告
      tags:
      - reports
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Report'
                      nextCursor:
                        type:
                        - string
                        - 'null'
                    required:
                    - items
                    - nextCursor
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id004
      - *id005
  /reports/{reportId}:
    get:
      operationId: getReport
      summary: 读取不可变报告
      tags:
      - reports
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/Report'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: reportId
        in: path
        required: true
        schema: *id001
  /reports/{reportId}/export:
    get:
      operationId: exportReport
      summary: 重新鉴权后导出Markdown
      tags:
      - reports
      responses:
        '200':
          description: Download report with Content-Disposition attachment. Export is audited.
          content:
            text/markdown:
              schema:
                type: string
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: reportId
        in: path
        required: true
        schema: *id001
  /anomaly-rules:
    get:
      operationId: listRules
      summary: 规则列表
      tags:
      - anomaly-rules
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AnomalyRule'
                      nextCursor:
                        type:
                        - string
                        - 'null'
                    required:
                    - items
                    - nextCursor
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id004
      - *id005
    post:
      operationId: createRule
      summary: 管理员创建规则
      tags:
      - anomaly-rules
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/AnomalyRule'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyRuleInput'
  /anomaly-rules/{ruleId}:
    patch:
      operationId: updateRule
      summary: CAS更新规则并产生新版本
      tags:
      - anomaly-rules
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/AnomalyRule'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: ruleId
        in: path
        required: true
        schema: *id001
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                definition:
                  $ref: '#/components/schemas/AnomalyRuleInput'
              required:
              - expectedVersion
              - definition
  /anomalies:
    get:
      operationId: listAnomalies
