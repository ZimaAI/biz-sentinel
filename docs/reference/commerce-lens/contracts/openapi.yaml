  /ingestions/{jobId}:
    get:
      operationId: getIngestion
      summary: 查询导入校验进度
      tags:
      - ingestions
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/Ingestion'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: jobId
        in: path
        required: true
        schema: *id001
  /ingestions/{jobId}/publish:
    post:
      operationId: publishIngestion
      summary: 管理员CAS发布不可变快照
      tags:
      - ingestions
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId: *id001
                  data:
                    $ref: '#/components/schemas/Dataset'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: jobId
        in: path
        required: true
        schema: *id001
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
              required:
              - expectedVersion
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: CL_SESSION
      description: HttpOnly Secure same-origin authenticated session. Mutations additionally require CSRF header.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id007
        message: *id007
        requestId: *id001
        details:
          type: object
      required:
      - code
      - message
      - requestId
    DateRange: &id008
      type: object
      additionalProperties: false
      properties:
        start: *id002
        endExclusive: *id002
      required:
      - start
      - endExclusive
    QuerySpec:
      type: object
      additionalProperties: false
      properties:
        metricIds:
          type: array
          items:
            enum: &id010
            - paid_gmv
            - paid_orders
            - aov
            - refund_amount
            - net_receipts
            - refund_intensity
            - visitor_sessions
            - order_conversion_rate
          minItems: 1
          maxItems: 8
          uniqueItems: true
        dimensions:
          type: array
          items:
            enum:
            - day
            - store
            - sku
          uniqueItems: true
          maxItems: 3
        dateRange: *id008
        comparison:
          enum:
          - PREVIOUS_WEEK_SAME_DAYS
          - PREVIOUS_PERIOD
          - NONE
        filters:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                const: productId
              operator:
                const: IN
              values:
                type: array
                items: *id001
                minItems: 1
                maxItems: 20
                uniqueItems: true
            required:
            - field
            - operator
            - values
          maxItems: 1
        limit:
          type: integer
          minimum: 1
          maximum: 1000
      required:
      - metricIds
      - dimensions
      - dateRange
      - comparison
      - filters
      - limit
      allOf:
      - if:
          properties:
            dimensions:
              contains:
                const: sku
        then:
          properties:
            metricIds:
              items:
                const: paid_gmv
            dimensions:
              contains:
                const: store
      - if:
          properties:
            filters:
              minItems: 1
        then:
          properties:
            metricIds:
              items:
                const: paid_gmv
            dimensions:
              contains:
                const: store
    Scope: &id009
      type: object
      additionalProperties: false
      properties:
        tenantId: *id001
        storeIds:
          type: array
          items: *id001
          minItems: 1
          uniqueItems: true
        authzVersion:
          type: integer
          minimum: 1
      required:
      - tenantId
      - storeIds
      - authzVersion
    Report:
      type: object
      additionalProperties: false
      properties:
        reportId: *id001
        version:
          type: integer
          minimum: 1
