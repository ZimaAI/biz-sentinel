                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id006
      - *id003
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                archive:
                  type: string
                  format: binary
