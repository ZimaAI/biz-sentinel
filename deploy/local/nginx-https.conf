# Managed exclusively by the Biz Sentinel deployment.
server {
    listen 80;
    server_name bizsentinel.zimagent.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/biz-sentinel-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://bizsentinel.zimagent.top$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bizsentinel.zimagent.top;
    ssl_certificate /etc/letsencrypt/live/bizsentinel.zimagent.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bizsentinel.zimagent.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Biz Sentinel";
    auth_basic_user_file /etc/biz-sentinel/htpasswd;
    client_max_body_size 10m;
    access_log /var/log/nginx/biz-sentinel.access.log;
    error_log /var/log/nginx/biz-sentinel.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location ~ ^/(api|nl2sql|uploads)/ {
        proxy_pass http://127.0.0.1:8065;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        gzip off;
    }
    location / {
        proxy_pass http://127.0.0.1:13000;
    }
}
