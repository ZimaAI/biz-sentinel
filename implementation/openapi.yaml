      parameters: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring WebFlux SESSION Cookie；HttpOnly、SameSite=Strict、8 小时会话。开发 HTTP 默认 Secure=false；HTTPS 部署设 COMMERCE_COOKIE_SECURE=true。登录前
        GET /auth/session 先建立匿名会话及 CSRF token。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 必须匹配同一个 SESSION 的 CSRF token。
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          minLength: 1
          maxLength: 96
        details:
          type: object
      required:
      - code
      - message
      - requestId
      - details
      description: 通用错误固定 code/message/requestId/details。请求参数错误一般 422；未知/不可见资源 404；未登录 401；CSRF、角色或显式越权 403；CAS/幂等冲突 409；事件游标过期
        410；预算限制 429；依赖不可用 503。
    DateRange:
      type: object
      additionalProperties: false
      properties:
        start:
          type: string
          format: date
        endExclusive:
          type: string
          format: date
      required:
      - start
      - endExclusive
    QuerySpec:
      type: object
      additionalProperties: false
      properties:
        metricIds:
          type: array
          items:
            enum:
            - paid_gmv
            - paid_orders
            - aov
            - refund_amount
            - net_receipts
            - refund_intensity
            - visitor_sessions
            - order_conversion_rate
          minItems: 1
          maxItems: 8
          uniqueItems: true
        dimensions:
          type: array
          items:
            enum:
            - day
            - store
            - sku
          uniqueItems: true
          maxItems: 3
        dateRange:
          type: object
          additionalProperties: false
          properties:
            start:
              type: string
              format: date
            endExclusive:
              type: string
              format: date
          required:
          - start
          - endExclusive
        comparison:
          enum:
          - PREVIOUS_WEEK_SAME_DAYS
          - PREVIOUS_PERIOD
          - NONE
        filters:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                const: productId
              operator:
                const: IN
              values:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 96
                minItems: 1
                maxItems: 20
                uniqueItems: true
            required:
            - field
            - operator
            - values
          maxItems: 1
        limit:
          type: integer
          minimum: 1
          maximum: 1000
      required:
      - metricIds
      - dimensions
      - dateRange
      - comparison
      - filters
      - limit
      allOf:
      - if:
          properties:
            dimensions:
              contains:
                const: sku
        then:
          properties:
            metricIds:
              items:
                const: paid_gmv
            dimensions:
              contains:
                const: store
      - if:
          properties:
            filters:
              minItems: 1
        then:
          properties:
            metricIds:
              items:
                const: paid_gmv
            dimensions:
              contains:
                const: store
      description: 仅允许已实现语义 ID；日期跨度 1–90 日；同星期对比最多 7 日；SKU/商品过滤仅支持 paid_gmv 且必须包含 store。没有 SQL/表名/tenantId/版本参数。查询结果最多 1000
        行/1 MiB，内部聚合超过 10000 行拒绝，单 SQL 3 秒，每租户最多 4 个并发查询。
    Scope:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 96
        storeIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 96
          minItems: 1
          uniqueItems: true
        authzVersion:
          type: integer
          minimum: 1
      required:
      - tenantId
      - storeIds
      - authzVersion
    Report:
      type: object
      additionalProperties: false
      properties:
        reportId:
          type: string
          minLength: 1
          maxLength: 96
        version:
          type: integer
          minimum: 1
        runId:
          type: string
          minLength: 1
          maxLength: 96
        title:
          type: string
        status:
          enum:
          - SUCCEEDED
          - PARTIAL
        createdAt:
          type: string
          format: date-time
        scope:
          type: object
          additionalProperties: false
          properties:
            tenantId:
              type: string
              minLength: 1
              maxLength: 96
            storeIds:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 96
              minItems: 1
              uniqueItems: true
            authzVersion:
              type: integer
              minimum: 1
          required:
          - tenantId
          - storeIds
          - authzVersion
        dateRange:
          type: object
          additionalProperties: false
          properties:
            start:
              type: string
              format: date
            endExclusive:
              type: string
              format: date
          required:
          - start
          - endExclusive
        comparisonRange:
          type: object
          additionalProperties: false
          properties:
            start:
              type: string
              format: date
            endExclusive:
              type: string
              format: date
          required:
          - start
          - endExclusive
        datasetVersionId:
          type: string
          minLength: 1
          maxLength: 96
        metricManifestHash:
          type: string
        claims:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              claimId:
                type: string
                minLength: 1
                maxLength: 96
              type:
                enum:
                - OBSERVATION
                - DECOMPOSITION
                - HYPOTHESIS
                - LIMITATION
                - RECOMMENDATION
              text:
                type: string
                maxLength: 2000
              evidenceRefs:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 96
                uniqueItems: true
              numericBindings:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    evidenceId:
                      type: string
                      minLength: 1
                      maxLength: 96
                    rowKey:
                      type: string
                    field:
                      type: string
                    transformId:
                      enum:
                      - IDENTITY
                      - DELTA
                      - RELATIVE_CHANGE
                      - PP_DELTA
                      - SHAPLEY_ORDERS
                      - SHAPLEY_AOV
                  required:
                  - evidenceId
                  - rowKey
                  - field
                  - transformId
              support:
                enum:
                - SUPPORTED
                - CONTRADICTED
                - INSUFFICIENT
            required:
            - claimId
            - type
            - text
            - evidenceRefs
            - numericBindings
            - support
          minItems: 1
        limitations:
          type: array
          items:
            type: string
        synthetic:
          type: boolean
        visibility:
          enum:
          - PRIVATE
          - TEAM
          default: PRIVATE
        tenantId:
          type: string
          minLength: 1
          maxLength: 160
        subjectId:
          type: string
          minLength: 1
          maxLength: 160
        _revision:
          type: integer
          minimum: 0
      required:
      - reportId
      - version
      - runId
      - title
      - status
      - createdAt
      - scope
      - dateRange
      - comparisonRange
      - datasetVersionId
      - metricManifestHash
      - claims
      - limitations
      - synthetic
      description: GET/list 去除 tenantId/subjectId/_revision；PATCH visibility 当前返回更新后的存储文档，含这三个元数据字段。新报告明确返回 visibility，早期报告省略时等同
        PRIVATE。共享仅限同租户且拥有完整店铺范围的成员，同时更新引用证据可见性。
    RunEvent:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          const: '1.0'
        runId:
          type: string
          minLength: 1
          maxLength: 96
        sequence:
          type: integer
          minimum: 1
        type:
          enum:
          - run.created
          - run.state.changed
          - plan.ready
          - approval.required
          - step.started
          - step.summary
          - evidence.ready
          - report.ready
          - run.completed
          - run.failed
          - run.cancelled
          - access.revoked
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          description: Payload varies by type; no raw private reasoning or unscoped query rows.
      required:
      - schemaVersion
      - runId
      - sequence
      - type
      - occurredAt
      - payload
    Store:
      type: object
      additionalProperties: false
      properties:
        storeId:
          type: string
          minLength: 1
          maxLength: 96
        name:
          type: string
        platform:
          type: string
      required:
      - storeId
      - name
      - platform
    Me:
      type: object
      additionalProperties: false
      properties:
        subjectId:
          type: string
          minLength: 1
          maxLength: 96
        tenantId:
          type: string
          minLength: 1
          maxLength: 96
        displayName:
          type: string
        roles:
          type: array
          items:
            enum:
            - TENANT_ADMIN
            - OPS_MANAGER
            - STORE_OPERATOR
            - VIEWER
        authzVersion:
          type: integer
        stores:
          type: array
          items:
            $ref: '#/components/schemas/Store'
      required:
      - subjectId
      - tenantId
      - displayName
      - roles
      - authzVersion
      - stores
    Quality:
      type: object
      additionalProperties: false
      properties:
        status:
          enum:
          - COMPLETE
          - PARTIAL
          - STALE
          - INVALID
        businessWatermark:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
        sourceStatus:
          type: object
          additionalProperties:
            enum:
            - COMPLETE
            - PARTIAL
            - INVALID
            - MISSING
        missingCoverage:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              source:
                type: string
              storeId:
                type: string
              date:
                type: string
                format: date
              reason:
                type: string
            required:
            - source
            - storeId
            - date
            - reason
      required:
      - status
      description: 查询/数据集返回水位、发布时间和 warnings；数学分解证据仅返回 status。PARTIAL 时相关指标为 null，不能补零。
    Metric:
      type: object
