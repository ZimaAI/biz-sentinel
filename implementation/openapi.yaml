        schema:
          type: string
        description: 先 GET /auth/session 获取。登录成功后使用响应的新 csrfToken；所有 POST/PATCH/DELETE 均要求。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedRunVersion:
                  type: integer
                  minimum: 1
              required:
              - expectedRunVersion
      security:
      - sessionCookie: []
        csrfToken: []
  /runs/{runId}/events:
    get:
      operationId: subscribeRunEvents
      summary: SSE订阅与重放，不启动任务
      tags:
      - runs
      responses:
        '200':
          description: 'Ordered persistent events; heartbeat comments have no ID. Event payload follows RunEvent. Expired
            cursor: 410.'
          content:
            text/event-stream:
              schema:
                type: string
              example: 'id: 1

                event: run.created

                data: {"schemaVersion":"1.0","runId":"r1","sequence":1,"type":"run.created","occurredAt":"2026-09-21T01:00:00Z","payload":{}}


                '
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: runId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 96
      description: 750ms 扫描持久事件，15s 注释心跳。Last-Event-ID 优先于 after；仅重放/订阅，不创建或推进运行。终态事件后关闭连接。
