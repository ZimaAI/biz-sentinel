# Implementation contract; reference design remains unchanged.
openapi: 3.1.0
info:
  title: CommerceLens 商脉经营分析 API（当前实现）
  version: '1.0'
  description: 对应 commerce profile 的实现契约。源设计保留在 docs/reference/commerce-lens/contracts/openapi.yaml。业务时区 Asia/Shanghai；日期左闭右开；金额为人民币分的十进制字符串，比率为十进制字符串。所有响应对象额外字段在本契约显式列出。运行事件
    schemaVersion=1.0。会话登录、权限、查询与运行均由真实后端执行；本地确定性规划器不代表已完成在线大模型评测。
servers:
- url: /api/commerce/v1
security:
- sessionCookie: []
paths:
  /me:
    get:
      operationId: getMe
      summary: 当前身份与授权范围
      tags:
      - me
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId:
                    type: string
                    minLength: 1
                    maxLength: 96
                  data:
                    $ref: '#/components/schemas/Me'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /overview:
    get:
      operationId: getOverview
      summary: 授权范围的经营总览
      tags:
      - overview
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId:
                    type: string
                    minLength: 1
                    maxLength: 96
                  data:
                    $ref: '#/components/schemas/Overview'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: storeIds
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 96
        style: form
        explode: true
        description: 可重复参数或逗号分隔店铺 ID；任何显式无权店铺拒绝整次请求。
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: endExclusive
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: comparison
        in: query
        required: true
        schema:
          enum:
          - PREVIOUS_WEEK_SAME_DAYS
          - PREVIOUS_PERIOD
  /metrics:
    get:
      operationId: listMetrics
      summary: 已发布指标目录
      tags:
      - metrics
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId:
                    type: string
                    minLength: 1
                    maxLength: 96
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Metric'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /queries:
    post:
      operationId: queryMetrics
      summary: 执行严格受控的指标查询
      tags:
      - queries
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId:
                    type: string
                    minLength: 1
                    maxLength: 96
                  data:
                    $ref: '#/components/schemas/QueryResult'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: 先 GET /auth/session 获取。登录成功后使用响应的新 csrfToken；所有 POST/PATCH/DELETE 均要求。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                requestedStoreIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 96
                  minItems: 0
                  description: 省略或空列表使用当前全部授权店铺；不得混入无权店铺。
                spec:
                  $ref: '#/components/schemas/QuerySpec'
              required:
              - spec
      security:
      - sessionCookie: []
        csrfToken: []
  /runs:
    post:
      operationId: createRun
      summary: 创建诊断运行，连接与执行独立
      tags:
      - runs
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId:
                    type: string
                    minLength: 1
                    maxLength: 96
                  data:
                    $ref: '#/components/schemas/Run'
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Same tenant/subject/operation/key with different body returns 409.
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: 先 GET /auth/session 获取。登录成功后使用响应的新 csrfToken；所有 POST/PATCH/DELETE 均要求。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRun'
      security:
      - sessionCookie: []
        csrfToken: []
    get:
      operationId: listRuns
      summary: 当前用户可见运行
      tags:
      - runs
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  requestId:
                    type: string
                    minLength: 1
                    maxLength: 96
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Run'
                      nextCursor:
                        type:
                        - string
                        - 'null'
                    required:
                    - items
                    - nextCursor
                required:
                - requestId
                - data
        default:
          description: 'Error: 400/401/403/404/409/410/422/429/503 as documented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        required: false
        schema:
          enum:
          - QUEUED
          - PLANNING
          - WAITING_APPROVAL
          - RUNNING
          - CANCEL_REQUESTED
          - SUCCEEDED
          - PARTIAL
          - FAILED
          - CANCELLED
          - EXPIRED
          - ACCESS_REVOKED
  /runs/{runId}:
    get:
      operationId: getRun
      summary: 运行快照
